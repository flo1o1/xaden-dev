name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Tool versions are pinned; update them deliberately (REQ-019 of the scaffold).
env:
  SEMGREP_VERSION: "1.180.0"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # linux_x64

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # later steps run project code; keep the job token out of .git/config
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pipx install "semgrep==$SEMGREP_VERSION"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks && sudo install gitleaks /usr/local/bin/gitleaks
      - name: Set up Python (if this is a Python project)
        if: hashFiles('pyproject.toml', 'setup.py', 'requirements*.txt') != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies and pinned tools
        if: hashFiles('pyproject.toml', 'setup.py', 'requirements*.txt') != ''
        run: |
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi # absent: check.sh names missing tools
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ] || [ -f setup.py ]; then python -m pip install -e .
          fi
      - name: Set up Node (if this is a Node project)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Node dependencies from the lockfile
        if: hashFiles('package.json') != ''
        run: npm ci
      - name: Static analysis (full run, missing tools fail)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: scripts/check.sh --strict
      # The registry rules are not pinned on purpose: new rules catch new vulnerability patterns,
      # so a finding can appear without a code change (docs/security.md, Static analysis).
      - name: SAST with semgrep registry rules (broader, needs network)
        run: semgrep scan --config p/default --metrics=off --error --quiet
      - name: Commit messages (contributors may not have local hooks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/verify-commits.sh --ci
