name: xaden

# Runs Xaden's checks next to the existing workflows. Added by `xaden project adopt`; the version and the
# checksum below are the ones pinned in xaden/xaden.conf and change only by pull request (REQ-072).
on:
  push:
    branches: [@DEFAULT_BRANCH@]
  pull_request:

permissions:
  contents: read

env:
  XADEN_VERSION: "@VERSION@"
  XADEN_CHECKSUM: "@CHECKSUM@"
  SEMGREP_VERSION: "1.180.0"
  BANDIT_VERSION: "1.9.4" # the pins of template/presets/python/requirements-dev.txt
  PIP_AUDIT_VERSION: "2.10.1"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # linux_x64

jobs:
  xaden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # later steps run project code; keep the job token out of .git/config
      - name: Install Xaden (pinned version, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/flo1o1/xaden-dev/archive/refs/tags/v${XADEN_VERSION}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/xaden-${XADEN_VERSION}"
          actual="$(find . -type f | sed 's|^\./||' | LC_ALL=C sort |
            while IFS= read -r file; do printf '%s  %s\n' "$(sha256sum <"$file" | awk '{ print $1 }')" "$file"; done |
            sha256sum | awk '{ print $1 }')"
          if [ "$actual" != "$XADEN_CHECKSUM" ]; then
            echo "ERROR: Xaden ${XADEN_VERSION} does not match the checksum in xaden/xaden.conf" >&2
            exit 1
          fi
          # The tree is exactly the pin your team reviewed. A project with require-signature = true runs only a
          # tree that has a record of the checksum it is meant to be; this CI trusts the pin (xaden project pin wrote a
          # signed checksum under that setting) and records it for this tree and no other.
          mkdir -p "${XDG_DATA_HOME:-$HOME/.local/share}/xaden/versions"
          printf '%s\n' "$XADEN_CHECKSUM" >"${XDG_DATA_HOME:-$HOME/.local/share}/xaden/versions/${XADEN_VERSION}.signed"
          echo "$RUNNER_TEMP/xaden-${XADEN_VERSION}/scripts" >>"$GITHUB_PATH"
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pipx install "semgrep==$SEMGREP_VERSION"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks && sudo install gitleaks /usr/local/bin/gitleaks
      - name: Set up Python (if this is a Python project)
        if: hashFiles('pyproject.toml', 'setup.py', 'requirements*.txt') != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node (if this is a Node project)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the project's dependencies
        run: |
          # Your own workflows build the project; the checks below need its dependencies as well.
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f package-lock.json ]; then npm ci; fi
      - name: Install the dependency audit and Bandit (Python)
        if: hashFiles('pyproject.toml', 'setup.py', 'requirements*.txt') != ''
        run: python -m pip install "bandit==$BANDIT_VERSION" "pip-audit==$PIP_AUDIT_VERSION"
      - name: Xaden checks (full run, missing tools fail)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: xaden.sh check --strict
